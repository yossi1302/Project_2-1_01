[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-viewer-tracking"
version = "0.1.0"
description = "Reproducible viewer-position tracking comparison for Project 2.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.10.6",
  "mediapipe==0.10.21",
  "numpy==1.26.4",
  "opencv-contrib-python==4.11.0.86",
]

[project.optional-dependencies]
parallax = [
  "flet==1.0.1",
  "flet-desktop==1.0.1",
  "panda3d==1.10.16",
]
dev = [
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[project.scripts]
viewer-tracking = "viewer_tracking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
exclude = ["Library analysis"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
